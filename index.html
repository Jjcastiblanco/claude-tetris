<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <form id="record-form" class="record-form hidden" autocomplete="off">
          <label class="record-form-label" for="player-name">¡Entraste en el top 5! Tu nombre:</label>
          <div class="record-form-row">
            <input id="player-name" type="text" maxlength="12" placeholder="Jugador" />
            <button type="submit" id="save-record-btn">Guardar</button>
          </div>
        </form>

        <div id="overlay-records" class="records"></div>
        <p id="overlay-stats" class="records-stats"></p>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div id="start-records" class="records"></div>
        <p id="start-stats" class="records-stats"></p>

        <button id="play-btn">Jugar</button>

        <div id="reset-records-block">
          <button id="reset-records-btn" class="btn-secondary">Resetear records</button>
        </div>
        <div id="reset-confirm" class="reset-confirm hidden">
          <span>¿Seguro que quieres borrar todos los records?</span>
          <div class="reset-confirm-row">
            <button id="reset-yes-btn" class="btn-danger">Sí, borrar</button>
            <button id="reset-no-btn" class="btn-secondary">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="game.js"></script>
</body>
</html>
